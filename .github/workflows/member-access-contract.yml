name: Member Access Contract

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:
  verify-member-access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository contract
        run: bash scripts/test_member_access_contract.sh
