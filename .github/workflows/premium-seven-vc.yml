name: Premium Seven WPBakery Pages
on:
  push:
    paths:
      - 'wordpress/pages/premium-seven/**'
      - 'wordpress/plugins/onegodian-premium-vc-pages/**'
      - 'config/premium-seven-pages.json'
      - 'scripts/test_premium_vc_pages.py'
      - '.github/workflows/premium-seven-vc.yml'
  pull_request:
    paths:
      - 'wordpress/pages/premium-seven/**'
      - 'wordpress/plugins/onegodian-premium-vc-pages/**'
      - 'config/premium-seven-pages.json'
      - 'scripts/test_premium_vc_pages.py'
      - '.github/workflows/premium-seven-vc.yml'
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify WPBakery source contracts
        run: python3 scripts/test_premium_vc_pages.py
      - name: Lint scoped styles plugin
        run: php -l wordpress/plugins/onegodian-premium-vc-pages/onegodian-premium-vc-pages.php
      - name: Package styling plugin for staged WordPress installation
        run: |
          cd wordpress/plugins
          zip -qr "$GITHUB_WORKSPACE/onegodian-premium-vc-pages.zip" onegodian-premium-vc-pages
          unzip -t "$GITHUB_WORKSPACE/onegodian-premium-vc-pages.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: onegodian-premium-vc-seven-staging-plugin
          path: onegodian-premium-vc-pages.zip
          retention-days: 30
